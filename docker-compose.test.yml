services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zchat
      POSTGRES_PASSWORD: zchat
      POSTGRES_DB: zchat_test
    ports: ['5433:5432']
    tmpfs: ['/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zchat']
      interval: 2s
      timeout: 2s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ['1026:1025', '8026:8025']
